  <body>
    <script>
      // Kill-switch: unregister any prior service worker and wipe its caches.
      // A stale SW from a previous deploy was serving a mismatched HTML shell
      // and preventing React from hydrating (login form looked like an image).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister().catch(() => {}));
        }).catch(() => {});
        if (window.caches && caches.keys) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
        }
      }
    </script>
    <div id="root"></div>
  </body>
